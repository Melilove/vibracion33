<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibración 33</title>
<meta name="description" content="Lo visualizo. Lo siento. Lo decreto. Aprende tarot con tu decreto, la luna, tiradas y diario.">
<meta name="theme-color" content="#14183A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vibración 33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#14183A; --tinta:#1E2452; --tinta-2:#283071; --linea:#38418A;
  --crema:#F3E6D3; --crema-suave:#C9BFD9; --iris:#7FB6E6; --tenue:#8E88AE;
  --oro:#F7C948; --naranja:#F28A2E; --rojo:#E23A2A;
  --fuego:linear-gradient(160deg,#F9D45C 0%,#F28A2E 50%,#E23A2A 100%);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Avenir Next",system-ui,-apple-system,sans-serif;
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-variant-numeric:lining-nums;background:radial-gradient(120% 70% at 50% 0%,#232A63 0%,var(--noche) 60%) fixed,var(--noche);
  color:var(--crema);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--iris);outline-offset:3px;border-radius:6px}

/* cielo estrellado */
#cielo{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#cielo i{position:absolute;width:2px;height:2px;border-radius:50%;background:#F3E6D3;opacity:.15;animation:titila var(--d,5s) ease-in-out var(--r,0s) infinite}
#cielo i.g{width:3px;height:3px;box-shadow:0 0 6px rgba(247,201,72,.6);background:#F9E7B0}
@keyframes titila{0%,100%{opacity:.12}50%{opacity:.85}}
#cielo b{position:absolute;width:90px;height:1px;background:linear-gradient(90deg,rgba(243,230,211,0),rgba(243,230,211,.8));transform:rotate(-24deg);opacity:0;animation:fugaz 11s ease-in 4s infinite}
@keyframes fugaz{0%{opacity:0;translate:0 0}2%{opacity:1}7%{opacity:0;translate:-260px 120px}100%{opacity:0;translate:-260px 120px}}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;
  padding:calc(env(safe-area-inset-top,0px) + 6px) 20px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
header.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:8px 0 2px}
.marca{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:.05em;margin:0;text-align:center;white-space:nowrap}
.marca span{background:linear-gradient(90deg,#F7C948,#F28A2E,#E23A2A,#F7C948);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 7s linear infinite}
@keyframes brillo{to{background-position:300% 0}}
.icon-btn{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--crema-suave)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.der{justify-self:end}
.idioma-btn{justify-self:start;background:none;border:1px solid var(--linea);border-radius:999px;height:32px;padding:0 11px;font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--crema-suave)}

.vista{display:none}
.vista.activa{display:block;animation:aparece .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes aparece{from{opacity:0;transform:translateY(10px)}}
h2.titulo{font-family:var(--serif);font-weight:500;font-size:31px;line-height:1.15;margin:16px 0 4px}
.sub{color:var(--crema-suave);margin:0 0 18px;font-size:15px}

/* cartas */
.carta-svg{display:block;width:100%;height:auto;border-radius:6%/3.6%;transition:transform .5s ease}
.carta-svg.inv{transform:rotate(180deg)}
.carta-img{display:block;width:100%;aspect-ratio:1110/1920;object-fit:cover;border-radius:5%/3%;background:var(--tinta-2);
  transition:transform .5s ease;box-shadow:0 0 0 1px rgba(247,201,72,.25)}
.carta-img.inv{transform:rotate(180deg)}

/* luna */
.luna-btn{display:flex;align-items:center;gap:12px;width:100%;background:rgba(30,36,82,.55);border:1px solid var(--linea);
  border-radius:16px;padding:10px 14px;text-align:left;margin:0 0 6px}
.luna-btn svg{width:40px;height:40px;flex:none;animation:respira 6s ease-in-out infinite}
@keyframes respira{0%,100%{filter:drop-shadow(0 0 2px rgba(243,230,211,.2))}50%{filter:drop-shadow(0 0 10px rgba(243,230,211,.55))}}
.luna-btn b{display:block;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2}
.luna-btn small{color:var(--crema-suave);font-size:13px}
.luna-grande{width:140px;margin:6px auto 12px;display:block}
.fases{list-style:none;padding:0;margin:8px 0 0}
.fases li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.fases li svg{width:28px;height:28px;flex:none}
.fases li span{flex:1}
.fases li time{color:var(--crema-suave);font-size:14px}

/* hoy */
.escenario{perspective:1200px;width:min(60vw,240px);margin:14px auto 22px}
.giro{position:relative;width:100%;aspect-ratio:1110/1920;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.giro.revelada{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;display:grid;align-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cara.frente{transform:rotateY(180deg)}
.giro .carta-svg.reverso{height:100%}
.reverso-btn{all:unset;display:block;width:100%;height:100%;cursor:pointer;border-radius:6%/3.6%}
.reverso-btn:focus-visible{outline:2px solid var(--iris);outline-offset:4px}
.giro:not(.revelada) .reverso-btn{animation:flota 4s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translateY(0);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}50%{transform:translateY(-8px);filter:drop-shadow(0 0 22px rgba(242,138,46,.4))}}
.giro.encendida::after{content:"";position:absolute;inset:-16%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(249,212,92,.6),rgba(242,138,46,.28) 55%,transparent);animation:llama 1.7s ease-out forwards}
@keyframes llama{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.chispas{position:absolute;inset:0;pointer-events:none}
.chispas i{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--oro);box-shadow:0 0 8px var(--naranja);
  animation:chispa 1.2s ease-out forwards}
@keyframes chispa{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
.lectura{animation:aparece .6s .7s cubic-bezier(.2,.7,.2,1) both}
.lectura.sin-anim{animation:none}

.campo{display:block;margin:0 0 18px}
.campo label{display:block;font-size:14px;color:var(--crema-suave);margin-bottom:6px}
.campo input,.campo textarea{width:100%;background:rgba(30,36,82,.7);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;outline:none;resize:vertical}
.campo textarea{min-height:130px;font-family:var(--serif);font-size:19px;line-height:1.5}
.campo input:focus,.campo textarea:focus{border-color:var(--iris)}
.pista{text-align:center;color:var(--crema-suave);font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 6px}
.lectura h3{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:0;text-align:center}
.orient{text-align:center;color:var(--oro);margin:6px 0 2px;font-size:15px}
.clave{text-align:center;color:var(--crema-suave);font-style:italic;font-family:var(--serif);font-size:18px;margin:0 0 18px}
.significado{font-family:var(--serif);font-size:20px;line-height:1.55;margin:0 0 22px;padding-left:14px;border-left:2px solid var(--naranja)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:500;
  background:var(--fuego);color:#2A0E05;transition:transform .15s ease}
.btn:active{transform:scale(.96)}
.btn.sec{background:transparent;color:var(--crema);border:1px solid var(--linea)}
.btn.peligro{background:transparent;color:#FF9C8C;border:1px solid #7A3340}
.btn.grande{width:100%;padding:15px 22px;font-size:17px}
.fila-btn{display:flex;gap:10px;flex-wrap:wrap}

/* firma */
.firma{text-align:center;margin:40px 0 4px;display:grid;gap:2px}
.firma small{color:var(--tenue);font-size:12px;letter-spacing:.04em}
.firma strong{font-family:var(--serif);font-style:italic;font-weight:600;font-size:26px;line-height:1.1;
  background:linear-gradient(90deg,#F9D45C,#F28A2E,#E23A2A,#F9D45C);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 9s linear infinite}
.firma span{color:var(--tenue);font-size:12px}

/* mazo */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 10px;margin:0 -20px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linea);background:transparent;border-radius:999px;padding:7px 15px;font-size:15px;color:var(--crema-suave);transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--crema);color:var(--noche);border-color:var(--crema)}
.buscar{width:100%;background:rgba(30,36,82,.7);border:1px solid var(--linea);border-radius:12px;padding:11px 14px;margin:0 0 18px;outline:none}
.buscar:focus{border-color:var(--iris)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 12px}
.mini{all:unset;cursor:pointer;display:block;text-align:center;border-radius:8px;transition:transform .2s ease}
.mini:active{transform:scale(.95)}
.mini:focus-visible{outline:2px solid var(--iris);outline-offset:4px}
.mini span{display:block;font-size:13px;line-height:1.25;margin-top:6px;color:var(--crema-suave)}
.vacio{color:var(--crema-suave);text-align:center;padding:30px 0}

/* dados */
.modos{display:flex;gap:8px;margin:0 0 16px}
.mesa{display:flex;justify-content:center;gap:14px;margin:8px 0 18px;min-height:120px;align-items:center}
.dado{width:96px;height:96px;flex:none}
.dado svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.mesa.rodando .dado{animation:rueda .9s cubic-bezier(.3,.6,.3,1)}
.mesa.rodando .dado:nth-child(2){animation-delay:.08s}
.mesa.rodando .dado:nth-child(3){animation-delay:.16s}
@keyframes rueda{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-38px) rotate(200deg)}60%{transform:translateY(0) rotate(330deg)}78%{transform:translateY(-10px) rotate(352deg)}100%{transform:translateY(0) rotate(360deg)}}
.leyenda{display:flex;justify-content:center;gap:14px;margin:-8px 0 14px;font-size:12px;color:var(--crema-suave)}
.leyenda span{width:96px;text-align:center}
.resultado{border:1px solid var(--linea);border-radius:16px;padding:6px 16px;margin:0 0 18px;background:rgba(30,36,82,.45);animation:aparece .5s .5s both}
.resultado .fila{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(56,65,138,.6)}
.resultado .fila:last-child{border-bottom:0}
.resultado dt{font-size:14px;color:var(--oro)}
.resultado dd{margin:0;font-family:var(--serif);font-size:19px;line-height:1.35}
.resultado dd small{display:block;font-family:var(--sans);font-size:14px;color:var(--crema-suave)}
.suma{text-align:center;font-family:var(--serif);font-size:40px;font-weight:600;margin:0 0 18px;animation:aparece .5s .5s both}
.suma small{display:block;font-family:var(--sans);font-size:14px;font-weight:400;color:var(--crema-suave)}
.nota-info{color:var(--crema-suave);font-size:14px;margin:0 0 16px}

/* diario */
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
.dato{border:1px solid var(--linea);border-radius:14px;padding:14px}
.dato b{display:block;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1}
.dato small{color:var(--crema-suave);font-size:13px}
.barras{border:1px solid var(--linea);border-radius:14px;padding:14px 16px;margin:0 0 26px}
.barras p{margin:0 0 10px;font-size:14px;color:var(--crema-suave)}
.barra{display:grid;grid-template-columns:80px 1fr 26px;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.barra i{display:block;height:8px;border-radius:4px;background:var(--tinta-2);overflow:hidden}
.barra i em{display:block;height:100%;border-radius:4px;transform-origin:left;animation:crece .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes crece{from{transform:scaleX(0)}}
.barra output{text-align:right;color:var(--crema-suave)}
.entrada{all:unset;cursor:pointer;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;width:100%;padding:14px 0;border-bottom:1px solid rgba(56,65,138,.6)}
.entrada:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.entrada time{font-size:13px;color:var(--crema-suave);display:flex;align-items:center;gap:6px}
.entrada time svg{width:14px;height:14px}
.entrada h4{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;line-height:1.2}
.entrada p{margin:4px 0 0;color:var(--crema-suave);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entrada .mini-dado{width:56px;height:56px}

/* hoja */
dialog{border:0;padding:0;background:transparent;color:var(--crema);max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(8,10,28,.7)}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;max-width:560px;margin:0 auto;background:var(--tinta);
  border-radius:22px 22px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 28px);animation:sube .38s cubic-bezier(.2,.7,.2,1)}
@keyframes sube{from{transform:translateY(60px);opacity:0}}
.asa{width:40px;height:4px;border-radius:2px;background:var(--linea);margin:0 auto 6px}
.hoja-top{display:flex;justify-content:flex-end;margin:-4px -8px 0}
.hoja .carta-grande{width:min(52vw,210px);margin:0 auto 18px}
.hoja h3{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:0;text-align:center}
.meta{text-align:center;color:var(--crema-suave);font-size:14px;margin:6px 0 4px}
.seccion{margin:18px 0 0}
.seccion h4{margin:0 0 6px;font-weight:500;font-size:15px;color:var(--oro)}
.seccion.inv h4{color:var(--iris)}
.seccion p{margin:0;font-family:var(--serif);font-size:19px;line-height:1.5}
.alterna{display:flex;justify-content:center;gap:8px;margin:0 0 6px}
.guardado{font-size:13px;color:var(--iris);min-height:18px;margin-top:-10px}
.ajuste{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--linea)}
.ajuste p{margin:2px 0 0;color:var(--crema-suave);font-size:14px}
.interruptor{position:relative;width:52px;height:30px;flex:none;appearance:none;-webkit-appearance:none;margin:0;background:var(--linea);border-radius:999px;transition:background .2s}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--crema);transition:transform .2s}
.interruptor:checked{background:var(--naranja)}
.interruptor:checked::after{transform:translateX(22px)}
.idiomas{display:grid;gap:10px;margin:14px 0 4px}
.idiomas button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--linea);background:transparent;border-radius:14px;padding:14px 16px;font-size:17px}
.idiomas button[aria-pressed="true"]{border-color:var(--oro);color:var(--oro)}

/* navegación */
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(20,24,58,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid rgba(56,65,138,.7);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.abajo div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.abajo button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tenue);font-size:12px;transition:color .2s}
nav.abajo button svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
nav.abajo button[aria-current="page"]{color:var(--oro)}
nav.abajo button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}

.aviso{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%) translateY(10px);
  background:var(--crema);color:var(--noche);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;white-space:nowrap}
.aviso.ver{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
svg text{font-variant-numeric:lining-nums}

/* ===== v1.3 ===== */
header.top{align-items:start}
.marca-wrap{text-align:center;padding-top:4px}
.slogan{margin:1px 0 0;font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--crema-suave);letter-spacing:.02em;white-space:nowrap}
.icon-btn,.idioma-btn{margin-top:4px}
nav.abajo div{grid-template-columns:repeat(5,1fr)}
nav.abajo button{font-size:11.5px}

.racha{border:1px solid var(--linea);border-radius:16px;padding:12px 14px;margin:0 0 10px;background:rgba(30,36,82,.55)}
.racha-top{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.racha-fuego{font-size:24px;line-height:1;animation:respira 3s ease-in-out infinite}
.racha-top div{flex:1}
.racha-top b{display:block;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2}
.racha-top small{color:var(--crema-suave);font-size:13px}
.racha-top em{font-style:normal;font-family:var(--serif);font-weight:600;font-size:20px;color:var(--oro)}
.racha-barra{display:block;height:6px;border-radius:3px;background:var(--tinta-2);overflow:hidden}
.racha-barra em{display:block;height:100%;border-radius:3px;background:var(--fuego);transform-origin:left;animation:crece 1.1s cubic-bezier(.2,.7,.2,1) both}
.aviso-luna{display:flex;align-items:center;gap:12px;border:1px solid rgba(247,201,72,.45);border-radius:16px;padding:12px 14px;margin:6px 0 0;
  background:linear-gradient(120deg,rgba(242,138,46,.14),rgba(30,36,82,.4))}
.aviso-luna p{margin:0;flex:1;font-size:15px}
.aviso-luna .btn{padding:9px 14px;font-size:14px;flex:none}

.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 18px}
.slot{text-align:center;background:none;border:0;padding:0}
.slot .escen{perspective:900px}
.slot .giro{transition-duration:.9s}
.slot b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;margin-top:8px;line-height:1.2}
.slot small{display:block;font-size:12px;color:var(--crema-suave);line-height:1.3}
.slot .reverso-btn[tabindex="-1"]{opacity:.55}
.slot.ver{cursor:pointer;color:inherit}
.aparece{animation:aparece .6s cubic-bezier(.2,.7,.2,1) both}
.cuenta{display:flex;align-items:center;gap:16px;border:1px solid var(--linea);border-radius:16px;padding:14px 16px;margin:0 0 22px}
.cuenta b{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1;background:var(--fuego);-webkit-background-clip:text;background-clip:text;color:transparent}
.cuenta p{margin:0;font-size:15px}
.subtitulo{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 4px}

.progreso{margin:0 0 14px}
.progreso b{display:block;font-family:var(--serif);font-weight:600;font-size:20px;margin-bottom:6px}
.escenario.estudio{width:min(56vw,220px);margin:12px auto 16px}
.respuesta{width:100%;height:100%;background:var(--tinta);border:1px solid var(--oro);border-radius:5%/3%;padding:16px 14px;overflow-y:auto;text-align:center;display:flex;flex-direction:column;justify-content:center}
.respuesta h3{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.1;margin:0 0 6px}
.respuesta .clave{margin:0 0 10px;font-size:16px}
.respuesta p{margin:0 0 8px;font-family:var(--serif);font-size:16px;line-height:1.35}
.respuesta .inv-txt{color:var(--iris);font-size:14.5px}
.fila-btn.duo{display:grid;grid-template-columns:1fr 1fr;margin:0 0 14px}

.numero{display:grid;grid-template-columns:74px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--linea)}
.num-cifra{font-family:var(--serif);font-weight:600;font-size:56px;line-height:1;text-align:center;background:var(--fuego);-webkit-background-clip:text;background-clip:text;color:transparent}
.num-txt small{color:var(--oro);font-size:14px}
.num-txt p{margin:2px 0 10px;font-family:var(--serif);font-size:19px;line-height:1.35}
.num-carta{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--linea);border-radius:12px;padding:6px 12px 6px 6px;font-size:14px;text-align:left}
.num-mini{width:30px;flex:none}

.abanico{position:relative;width:56px;height:97px}
.abanico > *{position:absolute;width:40px;top:6px}
.abanico > :nth-child(1){left:0;transform:rotate(-10deg)}
.abanico > :nth-child(2){left:8px;top:0;z-index:1}
.abanico > :nth-child(3){left:16px;transform:rotate(10deg);z-index:2}
.abanico > .inv:nth-child(1){transform:rotate(170deg)}
.abanico > .inv:nth-child(2){transform:rotate(180deg)}
.abanico > .inv:nth-child(3){transform:rotate(190deg)}
.fecha{background:rgba(30,36,82,.7);border:1px solid var(--linea);border-radius:10px;padding:8px 10px;color-scheme:dark;flex:none}

/* ritual */
.ritual{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:radial-gradient(90% 60% at 50% 40%,#2A3170 0%,#14183A 70%);animation:entra .6s ease both}
@keyframes entra{from{opacity:0}}
.ritual.sale{animation:salir .7s ease forwards}
@keyframes salir{to{opacity:0;transform:scale(1.04)}}
.ritual-sello{width:96px;height:96px;border-radius:24px;margin-bottom:8px;animation:respira 4s ease-in-out infinite}
.ritual-sello.grande{width:150px;height:150px;border-radius:36px}
.ritual small{color:var(--crema-suave);font-size:14px;letter-spacing:.04em}
.frase{margin:0;font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.15;opacity:0;animation:frase 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.f1{animation-delay:.5s}.f2{animation-delay:1.6s}
@keyframes frase{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ritual-btn{font-family:var(--serif);font-size:30px;font-weight:600;padding:10px 34px;margin-top:6px;opacity:0;animation:frase 1.1s 2.7s cubic-bezier(.2,.7,.2,1) forwards, chispea 2.4s 3.8s ease-in-out infinite}
@keyframes chispea{0%,100%{box-shadow:0 0 0 rgba(242,138,46,0)}50%{box-shadow:0 0 30px rgba(242,138,46,.55)}}
.ritual-dia{opacity:0;animation:frase .8s 3.4s forwards}
.celebra-txt{max-width:320px;margin:0;font-family:var(--serif);font-size:20px;opacity:0;animation:frase 1s 1s forwards}
@media (prefers-reduced-motion:reduce){.frase,.ritual-btn,.ritual-dia,.celebra-txt{opacity:1}}

/* ===== v1.4: navegación flotante con el sello al centro ===== */
:root{--nav-h:72px}
.app{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 48px)}
nav.abajo{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0}
nav.abajo .barra{max-width:536px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:rgba(30,36,82,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(56,65,138,.9);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
nav.abajo button.centro{position:relative;top:-20px;gap:4px}
nav.abajo button.centro img{width:62px;height:62px;border-radius:19px;box-shadow:0 0 0 4px #14183A,0 0 22px rgba(242,138,46,.45);transition:transform .25s,box-shadow .25s}
nav.abajo button.centro[aria-current="page"] img{transform:scale(1.06);box-shadow:0 0 0 4px #14183A,0 0 0 6px #F7C948,0 0 34px rgba(242,138,46,.7)}
nav.abajo button.centro span{margin-top:-2px}
.aviso{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 30px)}
.pestanas{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;margin:6px -20px 18px;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas .chip{padding:8px 16px}

.luna-btn{position:relative}
.flecha{margin-left:auto;font-size:26px;color:var(--crema-suave)}
.instalar{margin:10px 0 4px}
.instalar img{border-radius:12px;flex:none}
.instalar p{font-size:14px}.instalar small{color:var(--crema-suave)}

.btn.ig{background:linear-gradient(120deg,rgba(242,138,46,.18),rgba(226,58,42,.12));color:var(--crema);border:1px solid rgba(247,201,72,.55)}

.anillo{width:min(86vw,330px);margin:0 auto}

.calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendario .sem{text-align:center;font-size:12px;color:var(--crema-suave);padding-bottom:4px}
.dia{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;border-radius:12px;min-height:62px}
.dia svg{width:24px;height:24px}
.dia span{font-size:13px;margin-top:3px}
.dia small{font-size:8.5px;line-height:1.1;color:var(--oro);text-align:center;margin-top:1px}

.fmt-historia{width:34px;height:60px}.fmt-post{width:52px;height:52px;margin:4px 0}
.voz-btn{opacity:0;animation:frase .8s 2.2s forwards;padding:8px 16px;font-size:14px}

</style>

<script>
/* ===== Datos de Vibración 33 ===== */
const MAY_BASE=[["✧","Aire"],["☿","Mercurio"],["☽","Luna"],["♀","Venus"],["♈","Aries"],["♉","Tauro"],["♊","Géminis"],["♋","Cáncer"],["♌","Leo"],["♍","Virgo"],["♃","Júpiter"],["♎","Libra"],["▽","Agua"],["♏","Escorpio"],["♐","Sagitario"],["♑","Capricornio"],["♂","Marte"],["♒","Acuario"],["♓","Piscis"],["☉","Sol"],["△","Fuego"],["♄","Saturno"]];
const MAY_TXT={es:[["El Loco","inicio, libertad, salto de fe","Un comienzo nuevo te invita a confiar y lanzarte, aunque no veas todo el camino.","Imprudencia o miedo a dar el paso: revisa si saltas sin mirar o si te frenas de más."],["El Mago","voluntad, habilidad, manifestación","Tienes las herramientas para hacer realidad lo que te propones; es momento de actuar.","Talento disperso o manipulación: tu energía no está alineada con tu intención."],["La Sacerdotisa","intuición, misterio, saber interior","Escucha tu voz interna; la respuesta llega en silencio, no en la prisa.","Desconexión de tu intuición o secretos ocultos: vuelve hacia adentro."],["La Emperatriz","abundancia, creatividad, cuidado","Momento fértil para crear, cuidar y disfrutar; la abundancia crece cuando te nutres.","Bloqueo creativo o descuido de ti misma: das tanto que te vacías."],["El Emperador","estructura, autoridad, estabilidad","Orden, límites claros y liderazgo: construye bases sólidas.","Rigidez, control excesivo o falta de disciplina."],["El Hierofante","tradición, enseñanza, creencias","Aprender de una maestra, una tradición o una institución; el camino conocido te sostiene.","Cuestionar normas y romper con lo establecido para encontrar tu propia verdad."],["Los Enamorados","amor, elección, valores","Una unión o una decisión importante tomada desde el corazón y tus valores.","Desequilibrio en una relación o una elección que contradice lo que valoras."],["El Carro","determinación, avance, victoria","Avanzas con fuerza de voluntad; mantener el rumbo te lleva a la meta.","Falta de dirección o fuerzas que tiran en sentidos opuestos."],["La Fuerza","coraje, temple, compasión","La verdadera fuerza es suave: paciencia y valentía para domar tus impulsos.","Inseguridad, dudas sobre ti misma o emociones desbordadas."],["El Ermitaño","introspección, soledad, búsqueda","Tiempo de retirarte, reflexionar y buscar tu propia luz.","Aislamiento excesivo o resistencia a mirar hacia adentro."],["La Rueda de la Fortuna","ciclos, destino, cambio","La vida gira: un cambio de ciclo trae oportunidades.","Resistencia al cambio o sensación de mala racha; lo que baja también vuelve a subir."],["La Justicia","verdad, equilibrio, causa y efecto","Decisiones justas y honestas: cosechas lo que siembras.","Injusticia, evasión de responsabilidades o autoengaño."],["El Colgado","pausa, rendición, nueva perspectiva","Detenerte y mirar desde otro ángulo revela lo que no veías.","Estancamiento, sacrificios inútiles o resistencia a soltar."],["La Muerte","transformación, cierre, renacer","Un ciclo termina para que otro comience; soltar abre espacio a lo nuevo.","Miedo al cambio o aferrarte a lo que ya cumplió su ciclo."],["La Templanza","equilibrio, paciencia, armonía","Mezclar con calma los opuestos: el punto medio sana.","Excesos, impaciencia o desequilibrio."],["El Diablo","apego, tentación, sombra","Mira lo que te ata —hábitos, miedos, relaciones—; las cadenas suelen estar sueltas.","Liberación: rompes un apego o reconoces tu sombra."],["La Torre","ruptura, revelación, despertar","Algo construido sobre bases falsas cae; duele, pero libera.","Evitar un cambio inevitable, o una crisis interna más silenciosa."],["La Estrella","esperanza, sanación, inspiración","Después de la tormenta llega la calma: confía y renueva tu fe.","Desánimo o desconexión de tu propósito; tu luz sigue ahí."],["La Luna","intuición, ilusión, inconsciente","No todo es lo que parece: navega la incertidumbre con tu intuición.","Se disipan confusiones y miedos; la verdad sale a la luz."],["El Sol","alegría, éxito, vitalidad","Claridad, celebración y energía positiva: brillas.","Alegría opacada o exceso de optimismo; tu niña interior pide atención."],["El Juicio","llamado, renacimiento, evaluación","Despiertas a un propósito mayor: momento de evaluar y renacer.","Autocrítica dura o ignorar un llamado interior."],["El Mundo","logro, integración, cierre de ciclo","Completas una etapa con plenitud: celebra lo recorrido.","Algo queda pendiente para cerrar el ciclo; falta un último paso."]],
en:[["The Fool","beginnings, freedom, leap of faith","A new beginning invites you to trust and jump in, even if you can't see the whole path.","Recklessness or fear of taking the step: check whether you're leaping blindly or holding back too much."],["The Magician","willpower, skill, manifestation","You have the tools to make your intention real; it's time to act.","Scattered talent or manipulation: your energy isn't aligned with your intention."],["The High Priestess","intuition, mystery, inner knowing","Listen to your inner voice; the answer comes in silence, not in a rush.","Disconnected from your intuition, or hidden secrets: turn inward."],["The Empress","abundance, creativity, nurturing","A fertile time to create, nurture and enjoy; abundance grows when you nourish yourself.","Creative block or self-neglect: you give so much that you run empty."],["The Emperor","structure, authority, stability","Order, clear boundaries and leadership: build solid foundations.","Rigidity, excessive control or lack of discipline."],["The Hierophant","tradition, teaching, beliefs","Learning from a teacher, a tradition or an institution; the known path supports you.","Questioning norms and breaking with convention to find your own truth."],["The Lovers","love, choice, values","A union or an important decision made from the heart and your values.","Imbalance in a relationship, or a choice that contradicts what you value."],["The Chariot","determination, progress, victory","You move forward with willpower; holding your course takes you to the goal.","Lack of direction, or forces pulling in opposite ways."],["Strength","courage, composure, compassion","True strength is gentle: patience and bravery to tame your impulses.","Insecurity, self-doubt or overflowing emotions."],["The Hermit","introspection, solitude, search","Time to withdraw, reflect and seek your own light.","Excessive isolation, or resisting looking within."],["Wheel of Fortune","cycles, destiny, change","Life turns: a new cycle brings opportunities.","Resisting change or feeling a bad streak; what goes down comes back up."],["Justice","truth, balance, cause and effect","Fair, honest decisions: you reap what you sow.","Injustice, avoiding responsibility or self-deception."],["The Hanged Man","pause, surrender, new perspective","Stopping and looking from another angle reveals what you couldn't see.","Stagnation, pointless sacrifice or resistance to letting go."],["Death","transformation, endings, rebirth","One cycle ends so another can begin; letting go makes room for the new.","Fear of change, or clinging to what has run its course."],["Temperance","balance, patience, harmony","Blend opposites calmly: the middle path heals.","Excess, impatience or imbalance."],["The Devil","attachment, temptation, shadow","Look at what binds you — habits, fears, relationships; the chains are often loose.","Release: you break an attachment or face your shadow."],["The Tower","upheaval, revelation, awakening","Something built on false foundations falls; it hurts, but it frees you.","Avoiding an inevitable change, or a quieter inner crisis."],["The Star","hope, healing, inspiration","After the storm comes calm: trust and renew your faith.","Discouragement or disconnection from your purpose; your light is still there."],["The Moon","intuition, illusion, the unconscious","Not everything is as it seems: navigate uncertainty with your intuition.","Confusion and fears clear; the truth comes to light."],["The Sun","joy, success, vitality","Clarity, celebration and positive energy: you shine.","Dimmed joy or too much optimism; your inner child needs attention."],["Judgement","calling, rebirth, evaluation","You awaken to a greater purpose: time to evaluate and be reborn.","Harsh self-criticism or ignoring an inner calling."],["The World","completion, integration, end of a cycle","You complete a stage fully: celebrate how far you've come.","Something is still pending to close the cycle; one last step remains."]],
it:[["Il Matto","inizio, libertà, salto di fede","Un nuovo inizio ti invita a fidarti e lanciarti, anche se non vedi tutto il cammino.","Imprudenza o paura di fare il passo: chiediti se salti alla cieca o se ti trattieni troppo."],["Il Mago","volontà, abilità, manifestazione","Hai gli strumenti per realizzare ciò che desideri: è il momento di agire.","Talento disperso o manipolazione: la tua energia non è allineata con la tua intenzione."],["La Papessa","intuizione, mistero, sapere interiore","Ascolta la tua voce interiore; la risposta arriva nel silenzio, non nella fretta.","Disconnessione dall'intuizione o segreti nascosti: torna dentro di te."],["L'Imperatrice","abbondanza, creatività, cura","Momento fertile per creare, curare e godere; l'abbondanza cresce quando ti nutri.","Blocco creativo o trascuratezza verso te stessa: dai tanto da svuotarti."],["L'Imperatore","struttura, autorità, stabilità","Ordine, limiti chiari e leadership: costruisci basi solide.","Rigidità, controllo eccessivo o mancanza di disciplina."],["Il Papa","tradizione, insegnamento, credenze","Imparare da una guida, una tradizione o un'istituzione; la via conosciuta ti sostiene.","Mettere in discussione le regole per trovare la tua verità."],["Gli Amanti","amore, scelta, valori","Un'unione o una decisione importante presa con il cuore e i tuoi valori.","Squilibrio in una relazione o una scelta contraria ai tuoi valori."],["Il Carro","determinazione, avanzamento, vittoria","Avanzi con forza di volontà; mantenere la rotta ti porta alla meta.","Mancanza di direzione o forze che tirano in direzioni opposte."],["La Forza","coraggio, temperamento, compassione","La vera forza è dolce: pazienza e coraggio per domare gli impulsi.","Insicurezza, dubbi su te stessa o emozioni travolgenti."],["L'Eremita","introspezione, solitudine, ricerca","Tempo di ritirarti, riflettere e cercare la tua luce.","Isolamento eccessivo o resistenza a guardarti dentro."],["La Ruota della Fortuna","cicli, destino, cambiamento","La vita gira: un nuovo ciclo porta opportunità.","Resistenza al cambiamento o un periodo sfortunato; ciò che scende torna a salire."],["La Giustizia","verità, equilibrio, causa ed effetto","Decisioni giuste e oneste: raccogli ciò che semini.","Ingiustizia, fuga dalle responsabilità o autoinganno."],["L'Appeso","pausa, resa, nuova prospettiva","Fermarti e guardare da un'altra angolazione rivela ciò che non vedevi.","Stallo, sacrifici inutili o resistenza a lasciar andare."],["La Morte","trasformazione, chiusura, rinascita","Un ciclo finisce perché un altro inizi; lasciar andare fa spazio al nuovo.","Paura del cambiamento o attaccamento a ciò che ha esaurito il suo ciclo."],["La Temperanza","equilibrio, pazienza, armonia","Unire gli opposti con calma: la via di mezzo guarisce.","Eccessi, impazienza o squilibrio."],["Il Diavolo","attaccamento, tentazione, ombra","Guarda ciò che ti lega — abitudini, paure, relazioni; spesso le catene sono allentate.","Liberazione: rompi un attaccamento o riconosci la tua ombra."],["La Torre","rottura, rivelazione, risveglio","Ciò che è costruito su basi false crolla; fa male, ma libera.","Evitare un cambiamento inevitabile o una crisi interiore più silenziosa."],["La Stella","speranza, guarigione, ispirazione","Dopo la tempesta arriva la calma: fidati e rinnova la tua fede.","Scoraggiamento o distacco dal tuo scopo; la tua luce è ancora lì."],["La Luna","intuizione, illusione, inconscio","Non tutto è come sembra: attraversa l'incertezza con l'intuizione.","Confusione e paure si dissolvono; la verità viene a galla."],["Il Sole","gioia, successo, vitalità","Chiarezza, festa ed energia positiva: brilli.","Gioia offuscata o troppo ottimismo; la tua bambina interiore chiede attenzione."],["Il Giudizio","chiamata, rinascita, valutazione","Ti risvegli a uno scopo più grande: tempo di valutare e rinascere.","Autocritica severa o ignorare una chiamata interiore."],["Il Mondo","realizzazione, integrazione, fine di un ciclo","Completi una tappa con pienezza: celebra il cammino fatto.","Qualcosa resta in sospeso per chiudere il ciclo; manca un ultimo passo."]]};
const MEN_TXT={es:{"bastos":[["inspiración, nuevo proyecto, chispa","Nace una idea o una pasión con mucha energía: enciéndela.","Retrasos o falta de motivación para empezar."],["planificación, decisión, visión","Planificas tu siguiente paso con el mundo frente a ti.","Miedo a lo desconocido o planes que no se concretan."],["expansión, perspectiva, espera","Tus esfuerzos empiezan a dar frutos: mira más lejos.","Obstáculos para crecer o expectativas frustradas."],["celebración, hogar, estabilidad","Momento de celebrar logros y disfrutar en comunidad.","Tensiones en el hogar o una celebración postergada."],["conflicto, competencia, roces","Choques de ideas o competencia: pueden estimularte o desgastarte.","Evitar conflictos, o resolver por fin una tensión."],["victoria, reconocimiento, confianza","Éxito y reconocimiento por tu esfuerzo.","Inseguridad, falta de reconocimiento o ego inflado."],["defensa, perseverancia, postura","Defiendes tu lugar y tus convicciones con firmeza.","Agotamiento de vivir a la defensiva, o ceder bajo presión."],["rapidez, movimiento, noticias","Las cosas avanzan rápido: noticias o viajes en camino.","Retrasos, prisas o energía dispersa."],["resiliencia, cansancio, última prueba","Estás cansada pero cerca: resiste un poco más.","Agotamiento o actitud excesivamente defensiva."],["carga, responsabilidad, sobreexigencia","Llevas demasiado peso: revisa qué puedes soltar o delegar.","Liberarte de cargas, o colapsar por no soltarlas."],["entusiasmo, exploración, mensaje","Curiosidad y ganas de explorar algo nuevo.","Ideas sin dirección o impaciencia."],["acción, aventura, impulso","Te lanzas con pasión hacia lo que quieres.","Impulsividad, imprudencia o frustración."],["confianza, carisma, determinación","Brillas con seguridad, calidez y valentía.","Inseguridad, celos o energía agotada."],["liderazgo, visión, emprendimiento","Lideras con visión y capacidad de inspirar.","Autoritarismo, impulsividad o expectativas demasiado altas."]],"copas":[["amor nuevo, emoción, apertura","Se abre tu corazón: amor, compasión o un vínculo nuevo.","Emociones bloqueadas o amor propio descuidado."],["unión, conexión, reciprocidad","Un vínculo equilibrado y mutuo: atracción o alianza.","Desequilibrio o desconexión en una relación."],["amistad, celebración, comunidad","Alegría compartida con amigas y comunidad.","Excesos, chismes o sentirte excluida."],["apatía, contemplación, insatisfacción","Ensimismamiento: no ves la oportunidad que te ofrecen.","Despertar y abrirte de nuevo a lo que llega."],["pérdida, duelo, arrepentimiento","Lamentas lo perdido, pero aún quedan copas en pie detrás tuyo.","Aceptación: empiezas a sanar."],["nostalgia, infancia, recuerdos","Recuerdos dulces, inocencia o reencuentros del pasado.","Vivir anclada en el pasado; es tiempo de avanzar."],["opciones, fantasía, ilusión","Muchas opciones y sueños: distingue lo real de lo ilusorio.","Claridad para elegir; la confusión se disipa."],["partida, búsqueda, soltar","Te alejas de algo que ya no te llena para buscar más sentido.","Miedo a partir, o quedarte por costumbre."],["satisfacción, deseo cumplido, gratitud","La carta de los deseos: plenitud y gratitud.","Insatisfacción, o buscar afuera lo que está adentro."],["plenitud, familia, armonía","Felicidad emocional y armonía en tus vínculos.","Tensiones familiares o ideales que no calzan con la realidad."],["sensibilidad, mensaje, intuición creativa","Una sorpresa emocional o una intuición creativa.","Inmadurez emocional o bloqueo creativo."],["romance, encanto, propuesta","Sigues al corazón: propuestas o invitaciones.","Ilusiones, cambios de humor o promesas vacías."],["empatía, intuición, contención","Compasión, intuición profunda y cuidado.","Absorber emociones ajenas o descuidarte."],["calma, madurez emocional, sabiduría","Manejas tus emociones con madurez y serenidad.","Represión emocional o manipulación."]],"espadas":[["claridad, verdad, idea","Una idea clara corta la confusión; la verdad se revela.","Confusión mental o mal uso de las palabras."],["indecisión, bloqueo, tregua","Evitas decidir; quitarte la venda es necesario.","Información nueva que destraba una decisión, o sobrecarga."],["dolor, desamor, herida","Una verdad dolorosa o pena del corazón; reconocerla sana.","Recuperación y liberación del dolor."],["descanso, recuperación, pausa","Necesitas descansar y recuperar fuerzas.","Agotamiento, o volver a la actividad."],["conflicto, derrota, ego","Ganar a cualquier costo deja heridas: elige tus batallas.","Reconciliación o soltar resentimientos."],["transición, avance, alejarse","Dejas atrás aguas turbulentas hacia algo más tranquilo.","Resistencia a avanzar o asuntos sin resolver."],["estrategia, engaño, sigilo","Actuar con astucia; ojo con engaños propios o ajenos.","Confesión o verdades que salen a la luz."],["restricción, miedo, sentirse atrapada","Te sientes atrapada, pero las ataduras son más mentales que reales.","Liberación y nuevas perspectivas."],["ansiedad, preocupación, insomnio","Los miedos crecen de noche; no todo es tan grave como parece.","Esperanza: la ansiedad empieza a ceder."],["final, fondo, cierre doloroso","Tocas fondo, y desde aquí solo se puede subir.","Recuperación lenta o resistencia a un final inevitable."],["curiosidad, mente aguda, vigilancia","Ganas de aprender y comunicar ideas nuevas.","Chismes, palabras impulsivas o mente dispersa."],["rapidez, ambición, franqueza","Avanzas veloz con ideas claras y determinación.","Precipitación o palabras hirientes."],["lucidez, independencia, honestidad","Juicio claro, límites firmes y verdad sin rodeos.","Frialdad, amargura o dureza excesiva."],["autoridad, razón, ética","Decisiones racionales y justas desde la claridad.","Abuso de poder o manipulación con la razón."]],"oros":[["oportunidad, prosperidad, inicio","Una oportunidad concreta de prosperidad: trabajo, dinero o salud.","Oportunidad perdida o mala planificación."],["equilibrio, adaptación, malabarismo","Equilibras varias responsabilidades con flexibilidad.","Desorden o demasiados frentes abiertos."],["colaboración, oficio, aprendizaje","Trabajo en equipo y reconocimiento de tus habilidades.","Falta de cooperación o trabajo descuidado."],["seguridad, control, ahorro","Proteges lo que tienes; cuida no aferrarte de más.","Soltar el control, o gastar sin medida."],["escasez, dificultad, exclusión","Tiempos difíciles; la ayuda está más cerca de lo que crees.","Recuperación: sales de una mala racha."],["generosidad, dar y recibir","Compartir recursos y recibir apoyo.","Deudas, desigualdad o dar con condiciones."],["paciencia, inversión, evaluación","Tu esfuerzo crece lento: evalúa y ten paciencia.","Impaciencia o esfuerzo sin resultados."],["dedicación, maestría, práctica","Perfeccionas tu oficio con constancia.","Perfeccionismo o falta de enfoque."],["independencia, logro, disfrute","Disfrutas los frutos de tu trabajo con autonomía.","Dependencia económica o exceso de trabajo."],["legado, riqueza, estabilidad","Prosperidad duradera y bases sólidas.","Inestabilidad o conflictos familiares por bienes."],["estudio, ambición, nuevas metas","Ganas de aprender y empezar algo concreto.","Falta de avance o procrastinación."],["constancia, responsabilidad, rutina","Avanzas paso a paso con trabajo constante.","Estancamiento, aburrimiento o pereza."],["abundancia práctica, cuidado, hogar","Nutres tu hogar y tu bienestar con sentido práctico.","Descuido personal o desequilibrio entre trabajo y hogar."],["prosperidad, liderazgo, seguridad","Éxito material y liderazgo estable.","Materialismo o rigidez con el dinero."]]},
en:{"bastos":[["inspiration, new project, spark","A new idea or passion is born with lots of energy: light it up.","Delays or lack of motivation to start."],["planning, decision, vision","You plan your next step with the world before you.","Fear of the unknown, or plans that don't take shape."],["expansion, perspective, waiting","Your efforts start to bear fruit: look further ahead.","Obstacles to growth or frustrated expectations."],["celebration, home, stability","A time to celebrate achievements and enjoy community.","Tension at home or a postponed celebration."],["conflict, competition, friction","Clashing ideas or competition: they can fuel you or wear you down.","Avoiding conflict, or finally resolving a tension."],["victory, recognition, confidence","Success and recognition for your effort.","Insecurity, lack of recognition or an inflated ego."],["defense, perseverance, stance","You defend your place and convictions firmly.","Exhaustion from always being on guard, or giving in under pressure."],["speed, movement, news","Things move fast: news or travel on the way.","Delays, haste or scattered energy."],["resilience, fatigue, final test","You're tired but close: hold on a little longer.","Exhaustion or an overly defensive attitude."],["burden, responsibility, overload","You're carrying too much: see what you can drop or delegate.","Releasing burdens, or collapsing from not letting go."],["enthusiasm, exploration, message","Curiosity and the urge to explore something new.","Ideas without direction, or impatience."],["action, adventure, drive","You throw yourself passionately toward what you want.","Impulsiveness, recklessness or frustration."],["confidence, charisma, determination","You shine with confidence, warmth and courage.","Insecurity, jealousy or drained energy."],["leadership, vision, entrepreneurship","You lead with vision and the ability to inspire.","Authoritarianism, impulsiveness or unrealistic expectations."]],"copas":[["new love, emotion, openness","Your heart opens: love, compassion or a new bond.","Blocked emotions or neglected self-love."],["union, connection, reciprocity","A balanced, mutual bond: attraction or alliance.","Imbalance or disconnection in a relationship."],["friendship, celebration, community","Joy shared with friends and community.","Excess, gossip or feeling left out."],["apathy, contemplation, dissatisfaction","Self-absorption: you don't see the opportunity being offered.","Waking up and opening again to what comes."],["loss, grief, regret","You mourn what was lost, yet cups still stand behind you.","Acceptance: you begin to heal."],["nostalgia, childhood, memories","Sweet memories, innocence or reunions from the past.","Living anchored in the past; it's time to move on."],["options, fantasy, illusion","Many options and dreams: tell the real from the illusory.","Clarity to choose; the confusion fades."],["departure, search, letting go","You walk away from what no longer fulfills you to seek more meaning.","Fear of leaving, or staying out of habit."],["satisfaction, wish fulfilled, gratitude","The wish card: fulfillment and gratitude.","Dissatisfaction, or seeking outside what lies within."],["fulfillment, family, harmony","Emotional happiness and harmony in your bonds.","Family tension or ideals that don't match reality."],["sensitivity, message, creative intuition","An emotional surprise or a creative intuition.","Emotional immaturity or creative block."],["romance, charm, proposal","You follow your heart: proposals or invitations.","Illusions, mood swings or empty promises."],["empathy, intuition, emotional care","Compassion, deep intuition and support.","Absorbing others' emotions or neglecting yourself."],["calm, emotional maturity, wisdom","You handle your emotions with maturity and serenity.","Emotional repression or manipulation."]],"espadas":[["clarity, truth, idea","A clear idea cuts through confusion; the truth is revealed.","Mental confusion or misuse of words."],["indecision, stalemate, truce","You avoid deciding; removing the blindfold is necessary.","New information that unblocks a decision, or overload."],["pain, heartbreak, wound","A painful truth or heartache; acknowledging it heals.","Recovery and release from pain."],["rest, recovery, pause","You need to rest and regain strength.","Exhaustion, or returning to activity."],["conflict, defeat, ego","Winning at any cost leaves wounds: choose your battles.","Reconciliation or letting go of resentment."],["transition, moving on, leaving","You leave rough waters behind for calmer ones.","Resistance to moving on, or unresolved issues."],["strategy, deception, stealth","Act cleverly; watch out for deception, your own or others'.","Confession, or truths coming to light."],["restriction, fear, feeling trapped","You feel trapped, but the ties are more mental than real.","Release and new perspectives."],["anxiety, worry, sleeplessness","Fears grow at night; not everything is as bad as it seems.","Hope: the anxiety begins to ease."],["ending, rock bottom, painful closure","You hit bottom, and from here the only way is up.","Slow recovery or resisting an inevitable end."],["curiosity, sharp mind, vigilance","Eager to learn and share new ideas.","Gossip, rash words or a scattered mind."],["speed, ambition, bluntness","You move fast with clear ideas and determination.","Haste or hurtful words."],["lucidity, independence, honesty","Clear judgment, firm boundaries and plain truth.","Coldness, bitterness or excessive harshness."],["authority, reason, ethics","Rational, fair decisions born from clarity.","Abuse of power or manipulation through reason."]],"oros":[["opportunity, prosperity, beginning","A concrete chance for prosperity: work, money or health.","Missed opportunity or poor planning."],["balance, adaptability, juggling","You balance several responsibilities with flexibility.","Disorder or too many open fronts."],["collaboration, craft, learning","Teamwork and recognition of your skills.","Lack of cooperation or careless work."],["security, control, saving","You protect what you have; take care not to cling too tightly.","Releasing control, or spending without measure."],["scarcity, hardship, exclusion","Hard times; help is closer than you think.","Recovery: you leave a bad streak behind."],["generosity, giving and receiving","Sharing resources and receiving support.","Debts, inequality or giving with strings attached."],["patience, investment, assessment","Your effort grows slowly: assess and be patient.","Impatience or effort without results."],["dedication, mastery, practice","You refine your craft with consistency.","Perfectionism or lack of focus."],["independence, achievement, enjoyment","You enjoy the fruits of your work with autonomy.","Financial dependence or overwork."],["legacy, wealth, stability","Lasting prosperity and solid foundations.","Instability or family conflicts over assets."],["study, ambition, new goals","Eager to learn and start something concrete.","Lack of progress or procrastination."],["consistency, responsibility, routine","You move forward step by step with steady work.","Stagnation, boredom or laziness."],["practical abundance, care, home","You nurture your home and wellbeing with practical sense.","Self-neglect or imbalance between work and home."],["prosperity, leadership, security","Material success and stable leadership.","Materialism or rigidity with money."]]},
it:{"bastos":[["ispirazione, nuovo progetto, scintilla","Nasce un'idea o una passione piena di energia: accendila.","Ritardi o mancanza di motivazione per iniziare."],["pianificazione, decisione, visione","Pianifichi il prossimo passo con il mondo davanti a te.","Paura dell'ignoto o piani che non si concretizzano."],["espansione, prospettiva, attesa","I tuoi sforzi iniziano a dare frutti: guarda più lontano.","Ostacoli alla crescita o aspettative deluse."],["celebrazione, casa, stabilità","Momento di festeggiare i traguardi e godere della comunità.","Tensioni in casa o una festa rimandata."],["conflitto, competizione, attriti","Scontri di idee o competizione: possono stimolarti o logorarti.","Evitare i conflitti, o risolvere finalmente una tensione."],["vittoria, riconoscimento, fiducia","Successo e riconoscimento per il tuo impegno.","Insicurezza, mancanza di riconoscimento o ego gonfiato."],["difesa, perseveranza, posizione","Difendi il tuo posto e le tue convinzioni con fermezza.","Stanchezza di stare sempre sulla difensiva, o cedere alla pressione."],["rapidità, movimento, notizie","Le cose avanzano in fretta: notizie o viaggi in arrivo.","Ritardi, fretta o energia dispersa."],["resilienza, stanchezza, ultima prova","Sei stanca ma vicina: resisti ancora un po'.","Esaurimento o atteggiamento troppo difensivo."],["peso, responsabilità, sovraccarico","Porti troppo peso: vedi cosa puoi lasciare o delegare.","Liberarti dei pesi, o crollare per non lasciarli."],["entusiasmo, esplorazione, messaggio","Curiosità e voglia di esplorare qualcosa di nuovo.","Idee senza direzione o impazienza."],["azione, avventura, slancio","Ti lanci con passione verso ciò che desideri.","Impulsività, imprudenza o frustrazione."],["fiducia, carisma, determinazione","Brilli di sicurezza, calore e coraggio.","Insicurezza, gelosia o energia esaurita."],["leadership, visione, intraprendenza","Guidi con visione e capacità di ispirare.","Autoritarismo, impulsività o aspettative troppo alte."]],"copas":[["nuovo amore, emozione, apertura","Il tuo cuore si apre: amore, compassione o un nuovo legame.","Emozioni bloccate o amore per te stessa trascurato."],["unione, connessione, reciprocità","Un legame equilibrato e reciproco: attrazione o alleanza.","Squilibrio o distanza in una relazione."],["amicizia, celebrazione, comunità","Gioia condivisa con le amiche e la comunità.","Eccessi, pettegolezzi o sentirti esclusa."],["apatia, contemplazione, insoddisfazione","Chiusura in te stessa: non vedi l'opportunità che ti offrono.","Risveglio: ti apri di nuovo a ciò che arriva."],["perdita, lutto, rimpianto","Piangi ciò che hai perso, ma dietro di te restano coppe in piedi.","Accettazione: inizi a guarire."],["nostalgia, infanzia, ricordi","Ricordi dolci, innocenza o incontri dal passato.","Vivere ancorata al passato; è tempo di andare avanti."],["opzioni, fantasia, illusione","Molte opzioni e sogni: distingui il reale dall'illusorio.","Chiarezza per scegliere; la confusione si dissolve."],["partenza, ricerca, lasciar andare","Ti allontani da ciò che non ti appaga per cercare più senso.","Paura di partire, o restare per abitudine."],["soddisfazione, desiderio realizzato, gratitudine","La carta dei desideri: pienezza e gratitudine.","Insoddisfazione, o cercare fuori ciò che è dentro."],["pienezza, famiglia, armonia","Felicità emotiva e armonia nei tuoi legami.","Tensioni familiari o ideali lontani dalla realtà."],["sensibilità, messaggio, intuizione creativa","Una sorpresa emotiva o un'intuizione creativa.","Immaturità emotiva o blocco creativo."],["romanticismo, fascino, proposta","Segui il cuore: proposte o inviti.","Illusioni, sbalzi d'umore o promesse vuote."],["empatia, intuizione, cura","Compassione, intuizione profonda e accoglienza.","Assorbire le emozioni altrui o trascurarti."],["calma, maturità emotiva, saggezza","Gestisci le emozioni con maturità e serenità.","Repressione emotiva o manipolazione."]],"espadas":[["chiarezza, verità, idea","Un'idea chiara taglia la confusione; la verità si rivela.","Confusione mentale o cattivo uso delle parole."],["indecisione, stallo, tregua","Eviti di decidere; togliere la benda è necessario.","Nuove informazioni sbloccano una decisione, o sovraccarico."],["dolore, delusione d'amore, ferita","Una verità dolorosa o un dolore del cuore; riconoscerlo guarisce.","Guarigione e liberazione dal dolore."],["riposo, recupero, pausa","Hai bisogno di riposare e recuperare le forze.","Esaurimento, o ritorno all'attività."],["conflitto, sconfitta, ego","Vincere a ogni costo lascia ferite: scegli le tue battaglie.","Riconciliazione o lasciar andare il rancore."],["transizione, avanzare, allontanarsi","Lasci acque agitate verso qualcosa di più tranquillo.","Resistenza ad andare avanti o questioni irrisolte."],["strategia, inganno, astuzia","Agisci con astuzia; attenzione agli inganni, tuoi o altrui.","Confessione o verità che vengono a galla."],["restrizione, paura, sentirsi in trappola","Ti senti intrappolata, ma i legami sono più mentali che reali.","Liberazione e nuove prospettive."],["ansia, preoccupazione, insonnia","Le paure crescono di notte; non tutto è grave come sembra.","Speranza: l'ansia inizia a calare."],["fine, fondo, chiusura dolorosa","Tocchi il fondo, e da qui si può solo risalire.","Lenta ripresa o resistenza a una fine inevitabile."],["curiosità, mente acuta, vigilanza","Voglia di imparare e comunicare idee nuove.","Pettegolezzi, parole impulsive o mente dispersa."],["rapidità, ambizione, franchezza","Avanzi veloce con idee chiare e determinazione.","Precipitazione o parole che feriscono."],["lucidità, indipendenza, onestà","Giudizio chiaro, limiti fermi e verità senza giri di parole.","Freddezza, amarezza o durezza eccessiva."],["autorità, ragione, etica","Decisioni razionali e giuste nate dalla chiarezza.","Abuso di potere o manipolazione con la ragione."]],"oros":[["opportunità, prosperità, inizio","Un'opportunità concreta di prosperità: lavoro, denaro o salute.","Opportunità persa o cattiva pianificazione."],["equilibrio, adattamento, giocoleria","Bilanci varie responsabilità con flessibilità.","Disordine o troppi fronti aperti."],["collaborazione, mestiere, apprendimento","Lavoro di squadra e riconoscimento delle tue capacità.","Mancanza di cooperazione o lavoro trascurato."],["sicurezza, controllo, risparmio","Proteggi ciò che hai; attenta a non aggrapparti troppo.","Lasciare il controllo, o spendere senza misura."],["scarsità, difficoltà, esclusione","Tempi difficili; l'aiuto è più vicino di quanto credi.","Ripresa: esci da un periodo negativo."],["generosità, dare e ricevere","Condividere risorse e ricevere sostegno.","Debiti, disuguaglianza o dare con condizioni."],["pazienza, investimento, valutazione","Il tuo impegno cresce piano: valuta e abbi pazienza.","Impazienza o sforzo senza risultati."],["dedizione, maestria, pratica","Perfezioni il tuo mestiere con costanza.","Perfezionismo o mancanza di concentrazione."],["indipendenza, conquista, piacere","Godi i frutti del tuo lavoro in autonomia.","Dipendenza economica o troppo lavoro."],["eredità, ricchezza, stabilità","Prosperità duratura e basi solide.","Instabilità o conflitti familiari per beni."],["studio, ambizione, nuovi obiettivi","Voglia di imparare e iniziare qualcosa di concreto.","Mancanza di progressi o procrastinazione."],["costanza, responsabilità, routine","Avanzi passo dopo passo con lavoro costante.","Stallo, noia o pigrizia."],["abbondanza pratica, cura, casa","Nutri la tua casa e il tuo benessere con senso pratico.","Trascuratezza o squilibrio tra lavoro e casa."],["prosperità, leadership, sicurezza","Successo materiale e leadership stabile.","Materialismo o rigidità con il denaro."]]}};

/* ---------- Datos ---------- */
function cargar(){
  const base = {lecturas:[], notas:{}, estudio:{}, perfiles:[], voz:null, racha:{ultima:null,dias:0,max:0}, ajustes:{invertidas:true, idioma:"es", sur:true, nacimiento:"1992-11-03"}};
  try{
    const d = JSON.parse(localStorage.getItem(CLAVE) || localStorage.getItem("arcano13.datos"));
    if(d && Array.isArray(d.lecturas)) return {...base, ...d, racha:{...base.racha, ...(d.racha||{})}, ajustes:{...base.ajustes, ...(d.ajustes||{})}};
  }catch(e){}
  return base;
}
let datos = cargar();
let L = datos.ajustes.idioma || "es";
const t = () => T[L];
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(datos)); return true; }catch(e){ avisar(t().noGuardar); return false; } }
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const azar = n => { const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const hoyISO = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fechaDe = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fechaLarga = iso => cap(fechaDe(iso).toLocaleDateString(LOCALE[L],{weekday:"long",day:"numeric",month:"long"}));
const fechaCorta = d => d.toLocaleDateString(LOCALE[L],{day:"numeric",month:"short"});
const astroNom = k => L==="es" ? k : (ASTRO[k] ? ASTRO[k][L==="en"?0:1] : k);
const ocurrencias = () => datos.lecturas.flatMap(l => l.tipo==="dados" ? [] : l.cartas ? l.cartas : [{id:l.cartaId, inv:l.invertida}]);
const lecturaDelDia = () => datos.lecturas.find(l => (l.tipo||"carta")==="carta" && l.fecha===hoyISO());
const ayerISO = () => { const d=new Date(); d.setDate(d.getDate()-1); return hoyISO(d); };
const rachaActual = () => (datos.racha.ultima===hoyISO()||datos.racha.ultima===ayerISO()) ? datos.racha.dias : 0;
function tresCartas(){ const ids=new Set(), out=[]; while(out.length<3){ const c=MAZO[azar(MAZO.length)]; if(ids.has(c.id)) continue; ids.add(c.id); out.push({id:c.id, inv: datos.ajustes.invertidas ? azar(2)===1 : false}); } return out; }

const PALOS = ["bastos","copas","espadas","oros"];
const MAZO = [
  ...MAY_BASE.map(([glifo,astro],n) => ({id:"m"+n, tipo:"mayor", palo:null, num:n, glifo, astro, img:""})),
  ...PALOS.flatMap(palo => Array.from({length:14},(_,i)=>({id:palo+(i+1), tipo:"menor", palo, num:i+1, img:""})))
];
MAZO.forEach(c => c.rws = RWS[c.id]);

const carta = id => MAZO.find(c => c.id === id);
function txt(c){
  if(c.tipo==="mayor"){ const [nombre,clave,der,inv]=MAY_TXT[L][c.num]; return {nombre,clave,der,inv,etiqueta:ROMANOS[c.num],pie:astroNom(c.astro)}; }
  const [clave,der,inv]=MEN_TXT[L][c.palo][c.num-1]; const p=PALOS_TXT[L][c.palo]; const r=RANGOS[L][c.num-1];
  return {nombre:`${r} ${DE[L]} ${p[0]}`, clave, der, inv, etiqueta: c.num===1 ? r : c.num<=10 ? String(c.num) : r, pie:p[1]};
}

function caraSVG(c, inv=false, lazy=false, oculta=false){
  const src = c.img || (c.rws && c.rws[0]); const x = txt(c);
  if(src) return `<img class="carta-img${inv?" inv":""}" src="${esc(src)}" alt="${esc(x.nombre)}${inv?", "+t().invertida.toLowerCase():""}" data-id="${c.id}" data-inv="${inv?1:""}" data-oculta="${oculta?1:""}" crossorigin="anonymous" decoding="async"${lazy?' loading="lazy"':""} onerror="fallaImg(this)">`;
  return caraDibujada(c, inv, oculta);

function fallaImg(el){
  const c = carta(el.dataset.id);
  if(!el.dataset.reintento && c.rws && el.src !== c.rws[1]){ el.dataset.reintento="1"; el.removeAttribute("crossorigin"); el.src=c.rws[1]; return; }

}

/* ---------- Luna (cálculo astronómico simplificado, precisión de horas) ---------- */
const RAD=Math.PI/180, n360=x=>((x%360)+360)%360;
function astros(d=new Date()){
  const D=d.getTime()/864e5+2440587.5-2451545.0;
  const L0=n360(280.460+0.9856474*D), g=n360(357.528+0.9856003*D)*RAD;
  const sol=n360(L0+1.915*Math.sin(g)+0.020*Math.sin(2*g));
  const Lm=n360(218.316+13.176396*D), M=n360(134.963+13.064993*D)*RAD, F=n360(93.272+13.229350*D)*RAD, E=n360(297.850+12.190749*D)*RAD;
  const luna=n360(Lm+6.289*Math.sin(M)+1.274*Math.sin(2*E-M)+0.658*Math.sin(2*E)+0.214*Math.sin(2*M)-0.186*Math.sin(g)-0.114*Math.sin(2*F));
  return {sol, luna, frac:n360(luna-sol)/360};
}
const fraccionLunar=(d=new Date())=>astros(d).frac;
const signoDe = lon => Math.floor(n360(lon)/30)%12;
function proximaFase(obj, desde=new Date()){
  const dif=t=>n360((astros(new Date(t)).frac-obj)*360);
  let t=desde.getTime()+36e5, prev=dif(t);
  for(let i=0;i<280;i++){ const t2=t+3*36e5, d2=dif(t2);
    if(d2<prev){ let a=t,b=t2; for(let k=0;k<24;k++){ const m=(a+b)/2; if(dif(m)<dif(a)) b=m; else a=m; } return new Date(b); }
    t=t2; prev=d2; }
  return null;
}

function lunaCalendario(){

  let celdas=Array.from({length:inicio},()=>`<div></div>`).join("");
  for(let d=1; d<=dias; d++){
    const f0=fraccionLunar(new Date(y,m,d,0)), f1=fraccionLunar(new Date(y,m,d+1,0)), f=fraccionLunar(new Date(y,m,d,12));
    const ev=[[0,0],[.25,2],[.5,4],[.75,6]].find(([T])=>n360((f0-T)*360)>n360((f1-T)*360));
    const iso=hoyISO(new Date(y,m,d));
    celdas+=`<div class="dia${iso===hoy?" hoy":""}${ev?" evento":""}" title="${ev?LUNA_TXT[L][ev[1]][0]:""}">${lunaSVG(f)}<span>${d}</span>${ev?`<small>${LUNA_TXT[L][ev[1]][0].replace(/^Luna |^Moon /,"")}</small>`:""}</div>`;

const sabidas = () => MAZO.filter(c=>(datos.estudio[c.id]||0)>=2).length;
function siguienteTarjeta(){
  const pool=MAZO.filter(c=>filtroEst==="todas"||(filtroEst==="mayor"?c.tipo==="mayor":c.palo===filtroEst)).filter(c=>c.id!==tarjeta);
  const pesos=pool.map(c=>4-(datos.estudio[c.id]||0)); let r=Math.random()*pesos.reduce((a,b)=>a+b,0);

const reducir = n => { while(n>9 && ![11,22,33].includes(n)) n=String(n).split("").reduce((a,b)=>a+ +b,0); return n; };

/* ---------- Mi cielo ---------- */
function solDe(fecha){ const [y,m,d]=fecha.split("-").map(Number); const lon=astros(new Date(Date.UTC(y,m-1,d,15))).sol; return {signo:signoDe(lon), cuspide:(lon%30)<1.2||(lon%30)>28.8}; }
function asegurarYo(){ if(!datos.perfiles.length){ datos.perfiles.push({id:"yo", nombre:"", nacimiento:datos.ajustes.nacimiento, asc:null, luna:null}); guardar(); } }
const nombrePerfil = p => p.nombre || t().yo;
function posicionesCielo(p){
  const s=solDe(p.nacimiento), out=[{rol:t().sol, desc:t().solP, signo:s.signo}];
  if(p.asc!=null){ out.push({rol:t().ascendente, desc:t().ascP, signo:p.asc}); out.push({rol:t().descendente, desc:t().descP, signo:(p.asc+6)%12}); }
  if(p.luna!=null) out.push({rol:t().luna, desc:t().lunaP, signo:p.luna});
  return {pos:out, cuspide:s.cuspide};
}
function pintarCielo(){

/* ---------- Tiradas de 3 cartas (Decreto y Cumpleaños) ---------- */
function pintarCumple(){
  const c=$("#tirCont"), anio=new Date().getFullYear();

  else {

    c.innerHTML = top + `<h3 class="subtitulo">${t().cumplesAnteriores}</h3>` + (pasados.length ? pasados.map(entradaHTML).join("") : `<p class="nota-info">${t().sinCumples}</p>`);
    c.querySelectorAll(".entrada").forEach(b=>b.onclick=()=>abrirLectura(b.dataset.id));

function pintarTres(tipo, cont=$("#tirCont")){
  if(!est3[tipo]) est3[tipo]={cartas:tresCartas(), rev:0, guardada:false, reflexion:""};
  const e=est3[tipo], pos=posDe(tipo);
  cont.innerHTML = (tipo==="decreto" ? `<p class="nota-info">${t().decretoInfo}</p>` : "") +
    `<div class="tres">${e.cartas.map((o,i)=>`<div class="slot"><div class="escen"><div class="giro ${i<e.rev?"revelada":""}" data-g="${i}">
      <div class="cara"><button class="reverso-btn" data-r="${i}" aria-label="${pos[i][0]}" ${i!==e.rev?"tabindex='-1'":""}>${reversoSVG()}</button></div>
      <div class="cara frente">${caraSVG(carta(o.id),o.inv)}</div></div></div><b>${pos[i][0]}</b><small>${pos[i][1]}</small></div>`).join("")}</div>
    <div id="tresDetalle"></div>`;
  cont.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.r; if(i!==e.rev) return;
    const g=cont.querySelector(`[data-g="${i}"]`); g.classList.add("revelada","encendida"); e.rev++; navigator.vibrate?.(20);

    <div class="campo"><label for="reflex">${t().reflexion}</label><textarea id="reflex" placeholder="${t().reflexionPh}">${esc(e.reflexion)}</textarea></div>
    <div class="fila-btn" style="flex-direction:column"><button class="btn grande" id="gTres" ${e.guardada?"disabled":""}>${e.guardada?t().guardadoDiario:t().guardarDiario}</button>
    ${tipo==="decreto"?`<button class="btn sec grande" id="nTres">${t().nuevaTirada}</button>`:""}</div>`;

let grabadora=null;
function vozHTML(){ return datos.voz
  ? `<div class="fila-btn"><button class="btn sec" id="vozPlay">▶ ${t().escuchar}</button><button class="btn sec" id="vozGrabar">● ${t().grabar}</button><button class="btn peligro" id="vozBorrar">${t().borrarVoz}</button></div>`
  : `<button class="btn" id="vozGrabar">● ${t().grabar}</button>`; }
function enlazarVoz(){
  const p=$("#vozPlay"); if(p) p.onclick=()=>new Audio(datos.voz).play().catch(()=>{});
  const d=$("#vozBorrar"); if(d) d.onclick=()=>{ datos.voz=null; guardar(); $("#vozZona").innerHTML=vozHTML(); enlazarVoz(); };
  const g=$("#vozGrabar"); if(g) g.onclick=async()=>{
    if(grabadora){ grabadora.stop(); return; }
    try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); const partes=[];
      grabadora=new MediaRecorder(st); grabadora.ondataavailable=e=>partes.push(e.data);
      grabadora.onstop=()=>{ st.getTracks().forEach(x=>x.stop()); const fr=new FileReader();
        fr.onload=()=>{ datos.voz=fr.result; grabadora=null; if(guardar()) avisar(t().vozGuardada); $("#vozZona").innerHTML=vozHTML(); enlazarVoz(); };
        fr.readAsDataURL(new Blob(partes,{type:grabadora.mimeType||"audio/webm"})); };
      grabadora.start(); g.textContent="■ "+t().detener; g.classList.add("grabando");
      setTimeout(()=>{ if(grabadora && grabadora.state==="recording") grabadora.stop(); },15000);
    }catch(e){ grabadora=null; avisar(t().sinMicro); } };
}

/* ---------- Idioma y ajustes ---------- */
function cambiarIdioma(nuevo){ L=nuevo; datos.ajustes.idioma=nuevo; guardar(); pintarNav(); irA(vistaActual); }
$("#idiomaBtn").onclick=()=>{
  abrirHoja(`<h3>${t().idioma}</h3><div class="idiomas">${Object.entries(IDIOMAS).map(([k,n])=>`<button data-l="${k}" aria-pressed="${k===L}"><span>${n}</span><span>${k.toUpperCase()}</span></button>`).join("")}</div>`);
  hojaCont.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ cambiarIdioma(b.dataset.l); cerrarHoja(); });
};
$("#abrirAjustes").onclick=()=>{
  const A=datos.ajustes;
  abrirHoja(`<h3 style="margin-bottom:8px">${t().ajustes}</h3>
    <div class="ajuste"><div><b>${t().idioma}</b></div><div class="modos" style="margin:0">${Object.keys(IDIOMAS).map(k=>`<button class="chip" data-l="${k}" aria-pressed="${k===L}">${k.toUpperCase()}</button>`).join("")}</div></div>
    <div class="ajuste"><div><b>${t().nacimiento}</b><p>${t().nacimientoP}</p></div><input type="date" id="optNac" class="fecha" value="${A.nacimiento}"></div>
    <div class="ajuste"><div><b>${t().usarInv}</b><p>${t().usarInvP}</p></div><input type="checkbox" class="interruptor" id="optInv" ${A.invertidas?"checked":""} aria-label="${t().usarInv}"></div>
    <div class="ajuste"><div><b>${t().hemisferio}</b><p>${t().hemisferioP}</p></div><input type="checkbox" class="interruptor" id="optSur" ${A.sur?"checked":""} aria-label="${t().hemisferio}"></div>
    <div class="ajuste"><div><b>${t().mazoOffline}</b><p id="estadoMazo">${t().mazoOfflineP}</p></div><button class="btn sec" id="guardarMazo">${t().guardar}</button></div>
    <div class="ajuste" style="display:block"><b>${t().miVoz}</b><p>${t().miVozP}</p><div id="vozZona" style="margin-top:10px">${vozHTML()}</div></div>
    <div class="ajuste" style="border:0;padding-bottom:4px"><div><b>${t().respaldo}</b><p>${t().respaldoP}</p></div></div>
    <div class="fila-btn" style="margin:12px 0 8px"><button class="btn" id="exportar">${t().descargar}</button><button class="btn sec" id="importar">${t().restaurar}</button><input type="file" id="archivo" accept="application/json,.json" hidden></div>
    <div class="ajuste" style="border-bottom:0;border-top:1px solid var(--linea);margin-top:12px"><div><b>${t().empezarCero}</b><p>${t().empezarCeroP}</p></div><button class="btn peligro" id="borrarTodo">${t().borrarTodo}</button></div>
    ${firma()}<p class="meta" style="font-size:12px;margin-top:14px">${t().creditos}</p>`);
  hojaCont.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ cambiarIdioma(b.dataset.l); $("#abrirAjustes").click(); });
  hojaCont.querySelector("#optNac").onchange=e=>{ if(e.target.value){ A.nacimiento=e.target.value; const yo=datos.perfiles.find(p=>p.id==="yo"); if(yo) yo.nacimiento=e.target.value; guardar(); } };
  hojaCont.querySelector("#optInv").onchange=e=>{ A.invertidas=e.target.checked; guardar(); };
  hojaCont.querySelector("#optSur").onchange=e=>{ A.sur=e.target.checked; guardar(); };
  contarMazo(); hojaCont.querySelector("#guardarMazo").onclick=guardarMazo; enlazarVoz();
  hojaCont.querySelector("#exportar").onclick=()=>{
    const blob=new Blob([JSON.stringify({app:APP.nombre,version:APP.version,exportado:new Date().toISOString(),...datos},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`vibracion33-respaldo-${hoyISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); avisar(t().respaldoDescargado);
  };
  const arch=hojaCont.querySelector("#archivo");
  hojaCont.querySelector("#importar").onclick=()=>arch.click();
  arch.onchange=async()=>{ try{ const d=JSON.parse(await arch.files[0].text()); if(!Array.isArray(d.lecturas)) throw 0;
      if(!confirm(t().confirmRestaurar(d.lecturas.length))) return;
      datos={...datos, lecturas:d.lecturas, notas:d.notas||{}, estudio:d.estudio||datos.estudio, racha:d.racha||datos.racha, perfiles:d.perfiles||datos.perfiles, voz:d.voz||datos.voz, ajustes:{...datos.ajustes, ...(d.ajustes||{})}}; L=datos.ajustes.idioma||L; guardar();
      cerrarHoja(); pintarNav(); irA("vHoy"); avisar(t().respaldoRestaurado);
    }catch(e){ avisar(t().respaldoInvalido); } };
  hojaCont.querySelector("#borrarTodo").onclick=()=>{ if(!confirm(t().confirmBorrarTodo)) return;
    datos={...datos, lecturas:[], notas:{}}; guardar(); cerrarHoja(); irA("vHoy"); avisar(t().datosBorrados); };
};
async function contarMazo(){
  const el=$("#estadoMazo"); if(!el||!("caches" in window)) return;
  try{ const n=(await (await caches.open(CACHE_MAZO)).keys()).length;
    if(n>=MAZO.length){ el.textContent=t().guardadas; const b=$("#guardarMazo"); if(b){ b.textContent=t().listo; b.disabled=true; } }
    else if(n>0) el.textContent=t().parcial(n,MAZO.length);
  }catch(e){}
}
async function guardarMazo(){
  const b=$("#guardarMazo"), el=$("#estadoMazo");
  if(!("caches" in window)) return;
  b.disabled=true; let ok=0, n=0; const cache=await caches.open(CACHE_MAZO);
  const urls=MAZO.map(c=>c.img||(c.rws&&c.rws[0])).filter(Boolean);
  for(const u of urls){ n++; el.textContent=t().guardando(n,urls.length);
    try{ if(await cache.match(u)){ ok++; continue; } const r=await fetch(u,{mode:"cors"}); if(r.ok){ await cache.put(u,r); ok++; } }catch(e){} }
  if(ok===urls.length){ el.textContent=t().guardadas; b.textContent=t().listo; avisar(t().mazoGuardado); }
  else { el.textContent=t().parcial(ok,urls.length); b.disabled=false; }
}

/* ---------- Inicio ---------- */
document.querySelectorAll("nav.abajo button").forEach(b=>b.addEventListener("click",()=>irA(b.dataset.vista)));
cielo(); pintarNav(); irA("vHoy"); mostrarRitual();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
